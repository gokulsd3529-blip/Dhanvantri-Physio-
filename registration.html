 </head>
 <body data-page="registration">
  <a class="skip" href="#main">
   Skip to content
  </a>
  <div id="site-top">
  </div>
  <main id="main" tabindex="-1">
   <div class="pagehero">
    <div class="w">
     <div aria-label="Breadcrumb" class="crumbs" role="navigation">
      <a href="index.html">
       Home
      </a>
      /
      <span aria-current="page">
       Patient Resources
      </span>
      /
      <span aria-current="page">
       Registration
      </span>
     </div>
     <h1>
      Patient Registration
     </h1>
     <p>
      Share only the essentials. The clinic will collect clinical details in person.
     </p>
    </div>
   </div>
   <section>
    <div class="w two" style="align-items:start">
     <form aria-label="Submit Registration" data-kind="register" id="f" novalidate="">
      <div>
       <label for="name">
        Full Name
       </label>
       <input id="name" name="name" required="" type="text"/>
       <p class="err" id="e-name">
       </p>
      </div>
      <div>
       <label for="phone">
        Phone Number
       </label>
       <input id="phone" name="phone" required="" type="tel"/>
       <p class="err" id="e-phone">
       </p>
      </div>
      <div>
       <label for="email">
        Email (optional)
       </label>
       <input id="email" name="email" type="email"/>
       <p class="err" id="e-email">
       </p>
      </div>
      <div>
       <label for="addr">
        Address
       </label>
       <input id="addr" name="addr" required="" type="text"/>
       <p class="err" id="e-addr">
       </p>
      </div>
      <div>
       <label for="emerg">
        Emergency Contact (name and phone)
       </label>
       <input id="emerg" name="emerg" required="" type="text"/>
       <p class="err" id="e-emerg">
       </p>
      </div>
      <div aria-hidden="true" class="hp">
       <input autocomplete="off" name="website" tabindex="-1"/>
      </div>
      <div>
       <label class="chk">
        <input id="consent" required="" type="checkbox"/>
        <span>
         I agree that the clinic may use these details to respond to my request. See the
         <a href="privacy-policy.html">
          Privacy Policy
         </a>
         .
        </span>
       </label>
       <p class="err" id="e-consent">
       </p>
      </div>
      <button class="btn" id="sb" type="submit">
       Submit Registration
      </button>
      <div aria-live="polite" id="status" role="status">
      </div>
     </form>
     <div class="note">
      Please do not enter medical history here. Your details are handled as described in the
      <a href="privacy-policy.html">
       Privacy Policy
      </a>
      .
     </div>
    </div>
   </section>
  </main>
  <div id="site-bottom">
